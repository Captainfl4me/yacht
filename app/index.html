<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Yatch</title>
		<link data-trunk rel="copy-dir" href="assets" />
		<style>
			html, body {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
				/* pixel-art tiled background; the bevy canvas is transparent */
				background: #141a26 url("assets/pixel_bg.png") repeat;
				image-rendering: pixelated;
			}
			canvas {
				display: block;
				width: 100%;
				height: 100%;
				image-rendering: pixelated;
			}
		</style>
	</head>
	<body>
		<canvas id="bevy-canvas"></canvas>
	</body>
</html>
