[package]
name = "yatch-app"
version = "0.1.0"
edition = "2021"

[dependencies]
aeronet_websocket = { version = "0.14.0", features = ["client"] }
bevy = { version = "0.16", default-features = false, features = ["bevy_audio", "bevy_text", "default_font", "bevy_state", "bevy_log", "bevy_window", "bevy_ui", "multi_threaded", "std", "webgl2", "x11", "png"] }
speedy = "0.8.7"
shared = { path = "../shared/" }
uuid = { version = "1.16", features = ["v4", "js"] }
serde = "1.0.219"
dirs = "6.0.0"
aeronet_io = "0.14.0"
bevy_simple_text_input = "0.11.0"
bevy-persistent = { git = "https://github.com/fallible-algebra/bevy-persistent.git", branch = "version-bump/bevy-0.16.rc4", features = ["toml", "pretty"] }
strum = "0.27.1"
strum_macros = "0.27.1"
itertools = "0.14.0"
bevy-inspector-egui = "0.31.0"
